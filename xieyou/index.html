<head>
  <meta charset="UTF-8" />

  <title>Preview Carousel</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 計數器 -->
  <div class="counter" id="counter"></div>

  <!-- 主要輪播（左右位置不變，但內容改成上下切頁） -->

    <button id="prev" class="btn">〈</button>

      <!-- 你的 items（不用 active） -->
      <div class="item">
